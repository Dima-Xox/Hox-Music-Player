name: Build Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia qtimageformats'
          cache: true

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $h = Get-Content cpp/src/common/version.h -Raw
          if ($h -match '#define APP_VERSION "(.+?)"') {
            "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else { throw "APP_VERSION not found" }

      - name: Configure
        shell: pwsh
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt runtime (windeployqt)
        shell: pwsh
        run: |
          $wqt = Join-Path $env:QT_ROOT_DIR 'bin\windeployqt.exe'
          if (-not (Test-Path $wqt)) { throw "windeployqt not found: $wqt" }
          & $wqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-quick-import "build\bin\HoxPlayer.exe"
          & $wqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-quick-import "build\bin\HoxLauncher.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

      - name: Selfcheck (CI smoke)
        shell: pwsh
        run: |
          Get-ChildItem build\bin | Out-Host
          $tests = @('build\bin\HoxPlayer.exe', 'build\bin\HoxLauncher.exe')
          foreach ($t in $tests) {
            if (-not (Test-Path $t)) { throw "not found: $t" }
            $p = Start-Process -FilePath (Resolve-Path $t) -ArgumentList '--selfcheck' -Wait -PassThru -NoNewWindow
            Write-Host "$t exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "$t selfcheck failed: $($p.ExitCode)" }
          }
      - name: Assemble payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deploy\bin | Out-Null
          Copy-Item build\bin\* deploy\bin\ -Recurse -Force
          Copy-Item cpp\res\hox.ico deploy\bin\hox.ico -Force
          New-Item -ItemType Directory -Force deploy\redist | Out-Null
          curl.exe -sSL -o deploy\redist\vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          curl.exe -sSL -o deploy\redist\vc_redist.x86.exe https://aka.ms/vs/17/release/vc_redist.x86.exe
          $x64 = (Get-Item deploy\redist\vc_redist.x64.exe).Length
          $x86 = (Get-Item deploy\redist\vc_redist.x86.exe).Length
          if ($x64 -lt 1000000 -or $x86 -lt 1000000) { throw "vc_redist download too small: $x64 / $x86" }
          "Redists: x64=$x64 x86=$x86" | Out-Host

      - name: Install NSIS and build installer
        shell: pwsh
        run: |
          # welcome-страница MUI — стандартная, битмап не требуется

          # choco бывает недоступен (503 от community.chocolatey.org) —
          # ретраи + резервный путь: официальный zip NSIS с SourceForge
          $mk = $null
          foreach ($attempt in 1..2) {
            choco install nsis -y --no-progress
            $mk = Get-ChildItem "C:\Program Files*\NSIS\makensis.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
            if ($mk) { break }
            Write-Host "попытка $attempt не удалась, повтор через 20 сек…"
            Start-Sleep -Seconds 20
          }
          if (-not $mk) {
            Write-Host "choco недоступен — качаю официальный zip NSIS"
            foreach ($v in @('3.13','3.12','3.11')) {
              curl.exe -sSL -o nsis.zip "https://downloads.sourceforge.net/project/nsis/NSIS%203/$v/nsis-$v.zip"
              if ((Test-Path nsis.zip) -and ((Get-Item nsis.zip).Length -gt 2MB)) {
                Expand-Archive nsis.zip -DestinationPath nsis-portable -Force
                $mk = Get-ChildItem -Path nsis-portable -Recurse -Filter makensis.exe |
                      Select-Object -First 1 -ExpandProperty FullName
                if ($mk) { break }
              }
            }
          }
          if (-not $mk) { throw "makensis не найден (choco и SourceForge недоступны)" }
          Write-Host "makensis: $mk"
          $ver = "${{ steps.ver.outputs.version }}"
          $bytes = (Get-ChildItem deploy -Recurse -File | Measure-Object Length -Sum).Sum
          $kb = [int]($bytes / 1KB)
          & $mk /INPUTCHARSET UTF8 /DVERSION=$ver /DPAYLOAD="$env:GITHUB_WORKSPACE\deploy" `
            /DOUTFILE="$env:GITHUB_WORKSPACE\Hox-Setup-$ver.exe" /DESTSIZE=$kb `
            installer\hox-setup-cpp.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          $h2 = (Get-FileHash "Hox-Setup-$ver.exe" -Algorithm SHA256).Hash.ToLower()
          "$h2  Hox-Setup-$ver.exe" | Out-File -NoNewline "Hox-Setup-$ver.exe.sha256" -Encoding ascii
          Get-Content "Hox-Setup-$ver.exe.sha256"

      - name: Portable zip
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path deploy\bin\* -DestinationPath "Hox-Player-$ver.zip" -Force
          $h = (Get-FileHash "Hox-Player-$ver.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  Hox-Player-$ver.zip" | Out-File -NoNewline "Hox-Player-$ver.zip.sha256" -Encoding ascii
          Get-Content "Hox-Player-$ver.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hox-Setup-${{ steps.ver.outputs.version }}
          path: |
            Hox-Setup-${{ steps.ver.outputs.version }}.exe
            Hox-Setup-${{ steps.ver.outputs.version }}.exe.sha256
            Hox-Player-${{ steps.ver.outputs.version }}.zip
            Hox-Player-${{ steps.ver.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $md = Get-Content CHANGELOG.md -Raw
          $start = $md.IndexOf("## v$ver")
          if ($start -lt 0) { throw "CHANGELOG: нет секции v$ver" }
          $section = $md.Substring($start)
          $next = $section.IndexOf("`n## ", 1)
          if ($next -gt 0) { $section = $section.Substring(0, $next) }
          Set-Content -Path release-notes.md -Value $section -Encoding utf8
          Get-Content release-notes.md

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Hox v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            Hox-Setup-${{ steps.ver.outputs.version }}.exe
            Hox-Setup-${{ steps.ver.outputs.version }}.exe.sha256
            Hox-Player-${{ steps.ver.outputs.version }}.zip
            Hox-Player-${{ steps.ver.outputs.version }}.zip.sha256
