; Шаблон конфигурации лаунчера Hox.
; Скопируйте в %LOCALAPPDATA%\Hoxmusicp\launcher.ini и впишите свой репозиторий.

[updates]
; GitHub-репозиторий релизов в формате "владелец/имя-репозитория".
; Лаунчер запрашивает https://api.github.com/repos/<значение>/releases/latest
github_repo = владелец/hox-music-player

; Резервный JSON-манифест (необязательно; используется, если GitHub недоступен):
; manifest_url = https://example.com/hox/latest.json
